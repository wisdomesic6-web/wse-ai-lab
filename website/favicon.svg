<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="6" fill="#0A0C14"/>
  <!-- head -->
  <path d="M16,5 C21,5 24,8 24,12 L24,23 C24,25 22,27 20,27 L12,27 C10,27 8,25 8,23 L8,12 C8,8 11,5 16,5Z" fill="#0C1422" stroke="#C9A84C" stroke-width="1.2"/>
  <!-- brain dome -->
  <circle cx="16" cy="10" r="5.5" fill="#060A12" stroke="#C9A84C" stroke-width="1"/>
  <circle cx="16" cy="10" r="3.5" fill="none" stroke="#C9A84C" stroke-width=".5" opacity=".5"/>
  <circle cx="16" cy="10" r="2" fill="#C9A84C" opacity=".7"/>
  <circle cx="15.5" cy="9.5" r="1" fill="#fff" opacity=".5"/>
  <!-- eyes -->
  <ellipse cx="12.5" cy="17" rx="2.8" ry="2" fill="#050910" stroke="#C9A84C" stroke-width=".8"/>
  <circle cx="12.5" cy="17" r="1.2" fill="#C9A84C"/>
  <circle cx="12" cy="16.5" r=".5" fill="#fff" opacity=".6"/>
  <ellipse cx="19.5" cy="17" rx="2.8" ry="2" fill="#050910" stroke="#C9A84C" stroke-width=".8"/>
  <circle cx="19.5" cy="17" r="1.2" fill="#C9A84C"/>
  <circle cx="19" cy="16.5" r=".5" fill="#fff" opacity=".6"/>
  <!-- mouth -->
  <path d="M13,22 C14.5,23.2 17.5,23.2 19,22" fill="none" stroke="#C9A84C" stroke-width=".8" opacity=".5" stroke-linecap="round"/>
  <!-- antenna -->
  <line x1="14" y1="5" x2="13" y2="2.5" stroke="#C9A84C" stroke-width=".8" opacity=".7"/>
  <circle cx="13" cy="2" r="1.2" fill="#C9A84C" opacity=".85"/>
  <line x1="18" y1="5" x2="19" y2="2.5" stroke="#C9A84C" stroke-width=".8" opacity=".7"/>
  <circle cx="19" cy="2" r="1.2" fill="#C9A84C" opacity=".85"/>
  <!-- ears -->
  <rect x="5.5" y="15" width="2.5" height="7" rx="1" fill="#0D1523" stroke="#C9A84C" stroke-width=".6"/>
  <rect x="24" y="15" width="2.5" height="7" rx="1" fill="#0D1523" stroke="#C9A84C" stroke-width=".6"/>
</svg>
