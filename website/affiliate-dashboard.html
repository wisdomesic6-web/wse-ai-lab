<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affiliate Dashboard — WSE Lab Consult</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="index.html" aria-label="WSE Lab Consult home">
      <img class="logo-img" src="assets/logo.svg" alt="WSE Lab Consult" data-ph="logo">
      <span class="brand-name">WSE <b>Lab Consult</b></span>
    </a>
    <nav class="nav-links" aria-label="Primary">
      <a href="products.html" data-nav>Products</a>
      <a href="contact.html" data-nav>Contact</a>
      <button class="btn btn-ghost nav-cta" id="affLogoutBtn" type="button">Log Out</button>
    </nav>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <section class="section" style="padding-top:clamp(36px,4vw,56px)">
    <div class="wrap">

      <div id="affGate" style="display:none"></div>

      <div id="affDashboard" style="display:none">
        <div class="section-head">
          <span class="eyebrow">Affiliate Dashboard</span>
          <h1 class="h-lg">Welcome back, <span id="affName"></span></h1>
          <p class="lead">Your referral links, clicks, conversions, and commission — all in one place.</p>
        </div>

        <div class="stats-2x2" id="affTotals" style="max-width:none;grid-template-columns:repeat(4,1fr)"></div>

        <div style="margin:28px 0">
          <button class="btn btn-primary" id="affAddProductBtn" type="button">+ Add a Product to Promote</button>
        </div>

        <div id="affProductsList" class="grid g-2"></div>

        <div class="section-head" style="margin-top:56px">
          <span class="eyebrow">Payouts</span>
          <h2 class="h-md">Payout History</h2>
        </div>
        <div id="affPayoutsList"></div>
      </div>

    </div>
  </section>

  <!-- Product picker modal -->
  <div id="affPickerModal" class="aff-modal" style="display:none" role="dialog" aria-modal="true" aria-labelledby="affPickerTitle">
    <div class="aff-modal-panel">
      <div class="aff-modal-head">
        <h2 class="h-md" id="affPickerTitle">Which product do you want to market?</h2>
        <button id="affPickerClose" class="aff-modal-close" type="button" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="affPickerGrid" class="grid g-2"></div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="wrap">
    <div class="footer-bottom" style="border-top:0;margin-top:0">
      <span>WSE Lab Consult © <span data-year>2026</span> · Lagos, Nigeria</span>
      <span>Affiliate Portal</span>
    </div>
  </div>
</footer>

<script src="main.js" defer></script>
<script>
  document.getElementById('affLogoutBtn').addEventListener('click', function () {
    fetch('/.netlify/functions/affiliate-logout', { method: 'POST' }).then(function () {
      window.location.href = 'affiliate-login.html';
    });
  });
</script>
</body>
</html>
